<body class="game-page">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">&larr; ARCADE</a>
    <h1 class="game-title">BRICK BREAKER</h1>
    <div style="width: 116px"></div>
  </div>

      <button class="btn" id="overlay-btn">START</button>
    </div>
  </div>

  <p class="hint">
    Move with <kbd>Mouse</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd> &middot;
    Launch with <kbd>Click</kbd> or <kbd>Space</kbd> &middot;
